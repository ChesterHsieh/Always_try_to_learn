# Scenario: success-baseline
#
# Healthy pipeline run with default input. Verifies the monitoring stack
# observes the run end-to-end:
#   - Prometheus scrapes pipeline metrics
#   - OTel collector forwards spans with required attributes
#   - No alerts firing
#
# Used by: scripts/run-scenario.sh success-baseline

name: success-baseline
description: Baseline healthy pipeline run; everything green.

pipeline:
  input_records: 1000
  inject_failure: none

expected_run_status: succeeded
expected_failure_category: null
expected_alerts: []

probes:
  - id: records_processed
    cmd: prom-query
    args:
      query: 'pipeline_records_processed_total'
      gte: 1
      within: 60

  - id: run_completed
    cmd: prom-query
    args:
      query: 'pipeline_run_duration_seconds_count{status="succeeded"}'
      gte: 1
      within: 60

  - id: spans_accepted_by_collector
    cmd: prom-query
    args:
      query: 'sum(otelcol_receiver_accepted_spans_total{receiver="otlp"})'
      gte: 1
      within: 60

  - id: failure_alert_silent
    cmd: prom-query
    args:
      query: 'count(ALERTS{alertname="PipelineRunFailed",alertstate="firing"}) or vector(0)'
      eq: 0
      within: 30
