# Scenario: spark-driver-error
#
# Pipeline fails due to a Spark driver-level exception (SparkException at driver).
# Classified as spark_driver_error. Monitoring must detect: dedicated alert +
# PipelineSparkDriverError must fire.

name: spark-driver-error
description: Spark driver raises SparkException; Py4JJavaError classified as spark_driver_error.

pipeline:
  input_records: 100
  inject_failure: spark_driver_error

expected_run_status: failed
expected_failure_category: spark_driver_error
expected_alerts:
  - PipelineSparkDriverError

probes:
  - id: failure_category_metric
    cmd: prom-query
    args:
      query: 'pipeline_failures_total{failure_category="spark_driver_error"}'
      gte: 1
      within: 60

  - id: run_failed_metric
    cmd: prom-query
    args:
      query: 'pipeline_run_total{status="failed"}'
      gte: 1
      within: 60

  - id: alert_firing
    cmd: prom-query
    args:
      query: 'ALERTS{alertname="PipelineSparkDriverError",alertstate="firing"}'
      gte: 1
      within: 60

  - id: error_span
    cmd: otel-trace
    args:
      service: pyspark-pipeline
      has_attr: run_id
      within: 60
