# Scenario: spark-task-failed
#
# Pipeline fails because a Spark task raised an exception during execution
# (Py4JJavaError with TaskFailed pattern). Classified as spark_task_failed.
# Monitoring must detect: failure metric + PipelineRunFailed alert.

name: spark-task-failed
description: Spark task fails during execution; Py4JJavaError classified as spark_task_failed.

pipeline:
  input_records: 100
  inject_failure: spark_task_failed

expected_run_status: failed
expected_failure_category: spark_task_failed
expected_alerts:
  - PipelineRunFailed

probes:
  - id: failure_category_metric
    cmd: prom-query
    args:
      query: 'pipeline_failures_total{failure_category="spark_task_failed"}'
      gte: 1
      within: 60

  - id: run_failed_metric
    cmd: prom-query
    args:
      query: 'pipeline_run_total{status="failed"}'
      gte: 1
      within: 60

  - id: alert_firing
    cmd: prom-query
    args:
      query: 'ALERTS{alertname="PipelineRunFailed",alertstate="firing"}'
      gte: 1
      within: 60

  - id: error_span
    cmd: otel-trace
    args:
      service: pyspark-pipeline
      has_attr: run_id
      within: 60
