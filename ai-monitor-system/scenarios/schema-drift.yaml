# Scenario: schema-drift
#
# Two pipeline runs against the same dataset with incompatible schemas.
# Run 1 (pre-run, baseline) writes the dataset with schema v1 (`value: STRING`).
# Run 2 (main run) reads that dataset but selects a column that schema v1
# does not expose, so Spark's plan analyzer raises AnalysisException.
#
# Detection paths verified:
#   1. Prometheus metric label failure_category="spark_driver_error"
#   2. PipelineSparkDriverError alert fires
#   3. Lineage backend records the *baseline* run as COMPLETED and the
#      *drift* run as FAILED (real OpenLineage Spark listener events; the
#      run_id used here is the pipeline-emitted run_id from the second run)
#   4. Lineage dataset has at least 1 schema version recorded for the input
#      dataset (proves the prior run's schema persisted before the drift)

name: schema-drift
description: >
  Two-run schema drift: baseline writes dataset, drift run selects missing
  column and fails with AnalysisException. Verifies metric label, alert,
  and lineage detection of FAILED state on the second run.

pipeline:
  input_records: 100
  schema_version: v2
  inject_failure: none
  pre_runs:
    - schema_version: v1
      inject_failure: none

expected_run_status: failed
expected_failure_category: spark_driver_error
expected_alerts:
  - PipelineSparkDriverError

probes:
  - id: failure_category_metric
    cmd: prom-query
    args:
      query: 'pipeline_failures_total{failure_category="spark_driver_error"}'
      gte: 1
      within: 60

  - id: run_failed_metric
    cmd: prom-query
    args:
      query: 'pipeline_run_total{status="failed"}'
      gte: 1
      within: 60

  - id: alert_firing
    cmd: prom-query
    args:
      query: 'ALERTS{alertname="PipelineSparkDriverError",alertstate="firing"}'
      gte: 1
      within: 60

  - id: lineage_drift_run_failed
    cmd: lineage-run-state
    args:
      run_id: "{{ run_id }}"
      state_eq: FAILED
      within: 60
