groups:
  - name: pipeline-failure
    rules:
      # Shared alert: catches input/path/permission/spark-task/runtime_error
      # categories that do not warrant a dedicated alert channel.
      - alert: PipelineRunFailed
        expr: >
          increase(pipeline_failures_total{
            failure_category=~"input_not_found|invalid_path|permission_denied|spark_task_failed|runtime_error"
          }[5m]) > 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Pipeline {{ $labels.pipeline_name }} failed: {{ $labels.failure_category }}"
          runbook_link: "https://docs.example.com/runbook#failure-{{ $labels.failure_category }}"
          dashboard_link: "http://grafana/d/pipeline-health?var-pipeline_name={{ $labels.pipeline_name }}&from=now-15m&to=now"

      # Dedicated alert: Spark driver exceptions — high severity, separate routing.
      - alert: PipelineSparkDriverError
        expr: >
          increase(pipeline_failures_total{failure_category="spark_driver_error"}[5m]) > 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Spark driver error in pipeline {{ $labels.pipeline_name }}"
          runbook_link: "https://docs.example.com/runbook#failure-spark_driver_error"
          dashboard_link: "http://grafana/d/pipeline-health?var-pipeline_name={{ $labels.pipeline_name }}&from=now-15m&to=now"

      # Dedicated alert: lineage emission failure — data-lineage team routing.
      - alert: PipelineLineageEmissionFailed
        expr: >
          increase(pipeline_failures_total{failure_category="lineage_emission_failed"}[5m]) > 0
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "Lineage emission failed for pipeline {{ $labels.pipeline_name }}"
          runbook_link: "https://docs.example.com/runbook#failure-lineage_emission_failed"
          dashboard_link: "http://grafana/d/lineage-view?var-pipeline_name={{ $labels.pipeline_name }}&from=now-15m&to=now"

      # Dedicated alert: telemetry unavailable — observability-team routing.
      - alert: PipelineTelemetryUnavailable
        expr: >
          increase(pipeline_failures_total{failure_category="telemetry_unavailable"}[5m]) > 0
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "Telemetry unavailable for pipeline {{ $labels.pipeline_name }}"
          runbook_link: "https://docs.example.com/runbook#failure-telemetry_unavailable"
          dashboard_link: "http://grafana/d/pipeline-health?var-pipeline_name={{ $labels.pipeline_name }}&from=now-15m&to=now"

      # Dedicated alert: timeout — SLA/SLO team routing.
      - alert: PipelineRunTimeout
        expr: >
          increase(pipeline_failures_total{failure_category="timeout"}[5m]) > 0
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "Pipeline {{ $labels.pipeline_name }} timed out"
          runbook_link: "https://docs.example.com/runbook#failure-timeout"
          dashboard_link: "http://grafana/d/pipeline-health?var-pipeline_name={{ $labels.pipeline_name }}&from=now-15m&to=now"
