apiVersion: batch/v1
kind: Job
metadata:
  name: pyspark-pipeline
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: pyspark-pipeline
    app.kubernetes.io/part-of: ai-monitor-system
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pyspark-pipeline
    spec:
      restartPolicy: Never
      containers:
        - name: pipeline
          image: {{ .Values.pyspark.image }}
          imagePullPolicy: {{ .Values.pyspark.imagePullPolicy }}
          command: ["python", "-m", "pipeline.job"]
          env:
            - name: INPUT_PATH
              value: {{ .Values.pyspark.inputPath | quote }}
            - name: OUTPUT_PATH
              value: {{ .Values.pyspark.outputPath | quote }}
          envFrom:
            - configMapRef:
                name: openlineage-config
