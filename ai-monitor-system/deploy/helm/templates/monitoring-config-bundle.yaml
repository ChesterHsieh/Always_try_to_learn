apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-pipeline-dashboards
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: pipeline-dashboards
    app.kubernetes.io/part-of: ai-monitor-system
    grafana_dashboard: "1"
data:
{{ (.Files.Glob "dashboards/*.json").AsConfig | indent 2 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-pipeline-alert-rules
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: pipeline-alert-rules
    app.kubernetes.io/part-of: ai-monitor-system
data:
{{ (.Files.Glob "alerts/*.yaml").AsConfig | indent 2 }}
