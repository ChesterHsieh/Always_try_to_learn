{{- if .Values.upstream.openlineageBackend.enabled }}
# NodePort services for Marquez so probes/lineage-run-state can reach the
# API from outside the cluster without kubectl port-forward.
apiVersion: v1
kind: Service
metadata:
  name: marquez-query
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: marquez
    app.kubernetes.io/part-of: ai-monitor-system
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: upstream-marquez
    app.kubernetes.io/instance: monitor
    app: ilum-marquez
  ports:
    - name: http
      port: 9555
      targetPort: 9555
      nodePort: 30555
---
apiVersion: v1
kind: Service
metadata:
  name: marquez-web-query
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: marquez-web
    app.kubernetes.io/part-of: ai-monitor-system
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: upstream-marquez
    app.kubernetes.io/instance: monitor
    app: ilum-marquez-web
  ports:
    - name: http
      port: 9444
      targetPort: 9444
      nodePort: 30444
{{- end }}
