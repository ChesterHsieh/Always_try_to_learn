global:
  namespace: ai-monitor-system

# Upstream Helm charts are the sole observability deployment path.
# Self-managed stack has been removed; there is no migration flag.
upstream:
  prometheus:
    enabled: true
  grafana:
    enabled: true
  otelCollector:
    enabled: true
  openlineageBackend:
    enabled: true
  tempo:
    enabled: true

pyspark:
  image: local/ai-monitor-pyspark:latest
  imagePullPolicy: IfNotPresent
  inputPath: /app/.local-data/input/sample.txt
  outputPath: /app/.local-data/output/result.txt
  metricsPort: 9095

localData:
  enabled: true
  hostPath: ""

openlineage:
  enabled: true
  namespace: ai_monitor_system
  transport:
    type: http
    # Service DNS resolves within the namespace. Sub-chart names are
    # collapsed via fullnameOverride in values.local-minimal.yaml so we use
    # short, namespace-scoped names here.
    url: http://marquez:9555

# Where the pipeline pod sends OTLP traces (in-cluster collector, gRPC).
otel:
  endpoint: http://otel-collector:4317

# Where the pipeline pod pushes its final metrics before exiting.
# Pushgateway is part of the upstream-prometheus chart in this stack.
pushgateway:
  url: http://pushgateway:9091

"upstream-prometheus":
  server:
    replicaCount: 1
    extraArgs:
      "web.enable-remote-write-receiver": ""
      "enable-feature": "exemplar-storage"
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 300m
        memory: 512Mi
  extraScrapeConfigs: |
    - job_name: pyspark-pipeline
      scrape_interval: 15s
      kubernetes_sd_configs:
        - role: pod
          namespaces:
            names:
              - ai-monitor-system
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
          action: keep
          regex: pyspark-pipeline
        - source_labels: [__meta_kubernetes_pod_container_port_name]
          action: keep
          regex: metrics
        - source_labels: [__meta_kubernetes_namespace]
          target_label: kubernetes_namespace
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: kubernetes_pod_name
  serverFiles:
    "alerting_rules.yml":
      groups:
        - name: pipeline-failure
          rules:
            - alert: PipelineRunFailed
              expr: increase(pipeline_failures_total[1m]) > 0
              for: 1m
              labels:
                severity: critical
              annotations:
                summary: "PySpark pipeline {{ $labels.pipeline_name }} failed: {{ $labels.failure_category }}"
                pipeline_name: "{{ $labels.pipeline_name }}"
                failure_category: "{{ $labels.failure_category }}"
                dashboard_link: "http://grafana/d/pipeline-health?var-pipeline_name={{ $labels.pipeline_name }}&from=now-15m&to=now"
                runbook_link: "https://docs.example.com/runbook#failure-{{ $labels.failure_category }}"
        - name: stack-health
          rules:
            - alert: PipelineMetricsMissing
              expr: up{job="pyspark-pipeline"} == 0
              for: 2m
              labels:
                severity: warning
              annotations:
                summary: "PySpark pipeline metrics endpoint is unreachable"
            - alert: PipelineTelemetryStaleness
              expr: pipeline_telemetry_freshness_seconds > 300
              for: 1m
              labels:
                severity: warning
              annotations:
                summary: "Pipeline telemetry is stale (> 5 minutes)"
                pipeline_name: "{{ $labels.pipeline_name }}"
                dashboard_link: "http://grafana/d/pipeline-health?var-pipeline_name={{ $labels.pipeline_name }}"

"upstream-grafana":
  replicas: 1
  # Local-dev only: anonymous Admin access. The stack is reset frequently,
  # the auto-generated admin password rotates each reset, and we don't want
  # `kubectl get secret … -o jsonpath` in every readme step. Never enable
  # this for any non-local environment.
  "grafana.ini":
    auth.anonymous:
      enabled: true
      org_role: Admin
      hide_version: true
    auth:
      disable_login_form: true
      disable_signout_menu: true
    users:
      allow_sign_up: false
  # We DO want sidecar to load datasources/dashboards from ConfigMaps so that
  # the chart's `datasources` block below + our monitor-pipeline-dashboards
  # ConfigMap actually appear in the Grafana UI. (Previously these were
  # disabled, which silently produced an empty Grafana on a "running" stack.)
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard       # ConfigMaps with this label are picked up
      labelValue: "1"
      searchNamespace: ALL
    datasources:
      enabled: true
      label: grafana_datasource
      labelValue: "1"
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          url: http://prometheus-server
          access: proxy
          isDefault: true
        - name: Tempo
          type: tempo
          url: http://tempo:3100
          access: proxy
  dashboardsConfigMaps:
    default: "monitor-pipeline-dashboards"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi

"upstream-otel-collector":
  mode: deployment
  config:
    exporters:
      prometheusremotewrite:
        endpoint: "http://prometheus-server.ai-monitor-system.svc:80/api/v1/write"
      otlp/tempo:
        endpoint: "tempo:4317"
        tls:
          insecure: true
      logging:
        verbosity: detailed
    service:
      pipelines:
        metrics:
          exporters: [prometheusremotewrite]
        traces:
          exporters: [otlp/tempo, logging]
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

"upstream-marquez":
  service:
    type: ClusterIP
  web:
    service:
      type: ClusterIP
  postgresql:
    enabled: true
    primary:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 300m
          memory: 512Mi

"upstream-tempo":
  fullnameOverride: tempo
  tempo:
    # Accept OTLP gRPC from otel-collector
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/traces
        wal:
          path: /var/tempo/wal
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
