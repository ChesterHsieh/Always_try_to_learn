global:
  namespace: ai-monitor-system

upstream:
  prometheus:
    enabled: true
  grafana:
    enabled: true
  otelCollector:
    enabled: true
  openlineageBackend:
    enabled: true
  tempo:
    enabled: true

pyspark:
  imagePullPolicy: IfNotPresent
  metricsPort: 9095

localData:
  enabled: true
  hostPath: ""

"upstream-prometheus":
  fullnameOverride: prometheus
  server:
    fullnameOverride: prometheus-server
    replicaCount: 1
    persistentVolume:
      enabled: false
    retention: "2h"
    extraArgs:
      "web.enable-remote-write-receiver": ""
      "enable-feature": "exemplar-storage"
    resources:
      requests:
        cpu: 80m
        memory: 384Mi
      limits:
        cpu: 500m
        memory: 768Mi
    service:
      type: NodePort
      nodePort: 30090
      servicePort: 80
  alertmanager:
    fullnameOverride: alertmanager
    persistence:
      enabled: false
  prometheus-pushgateway:
    fullnameOverride: pushgateway
  kube-state-metrics:
    fullnameOverride: kube-state-metrics
  prometheus-node-exporter:
    fullnameOverride: node-exporter

"upstream-grafana":
  fullnameOverride: grafana
  replicas: 1
  # Inherit sidecar.dashboards/datasources.enabled from values.yaml (true).
  # Local dev still wants Grafana populated; only persistence-heavy features
  # are turned off in this overlay.
  service:
    type: NodePort
    nodePort: 30300
  resources:
    requests:
      cpu: 80m
      memory: 192Mi
    limits:
      cpu: 250m
      memory: 384Mi

"upstream-otel-collector":
  fullnameOverride: otel-collector
  mode: deployment
  resources:
    requests:
      cpu: 80m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

"upstream-tempo":
  fullnameOverride: tempo
  service:
    type: NodePort
    nodePorts:
      tempo: 30318       # Tempo HTTP query API (probe target)
      otlp-grpc: 30317   # OTLP gRPC from outside cluster (optional)

"upstream-marquez":
  fullnameOverride: marquez
  service:
    type: NodePort
    nodePorts:
      http: 30555
  web:
    service:
      type: NodePort
      nodePorts:
        http: 30444
  postgresql:
    enabled: true
    # IMPORTANT: do NOT override this. Marquez's wait-for-db init container
    # hardcodes the host as `monitor-postgresql`, derived from the chart's
    # default fullname pattern. Renaming via fullnameOverride breaks startup
    # (init loops "no response"). Leave the chart-default name intact.
    primary:
      persistence:
        enabled: false
      resources:
        requests:
          cpu: 80m
          memory: 192Mi
        limits:
          cpu: 250m
          memory: 384Mi
  resources:
    requests:
      cpu: 80m
      memory: 192Mi
    limits:
      cpu: 250m
      memory: 384Mi
