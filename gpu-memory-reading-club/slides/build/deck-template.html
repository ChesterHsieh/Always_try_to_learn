<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<!-- 由 slides/build/generate_*.js 產生，請改腳本後重建，不要手改本檔 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0A111D; --bar: #0E1726; --ink: #EAF1FB; --mute: #8FA6C4; --line: #2A3D5C; --accent: #38BDF8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: "PingFang TC", "Noto Sans TC", sans-serif; }
  a { color: var(--accent); }

  .bar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 12px; padding: 10px 16px;
         background: var(--bar); border-bottom: 1px solid var(--line); font-size: 14px; }
  .bar .title { flex: 1; min-width: 0; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar a, .bar button { color: var(--mute); text-decoration: none; background: none; border: 1px solid var(--line);
         border-radius: 6px; padding: 5px 10px; font: inherit; cursor: pointer; white-space: nowrap; }
  .bar a:hover, .bar button:hover { color: var(--ink); border-color: var(--mute); }
  .bar .count { color: var(--mute); font-family: Menlo, "JetBrains Mono", monospace; font-size: 13px; }

  main { max-width: 1280px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 20px; }
  .slide { scroll-margin-top: 64px; }
  .stage { position: relative; width: 100%; aspect-ratio: 13.333 / 7.5; overflow: hidden; container-type: inline-size;
           border-radius: 6px; box-shadow: 0 2px 16px rgba(0,0,0,.45); }
  .stage > * { position: absolute; }
  .stage .t { display: flex; flex-direction: column; overflow: visible; overflow-wrap: anywhere; }
  .stage .t p { margin: 0; white-space: pre-wrap; }
  .stage .t p.b { position: relative; }
  .stage .t p.b::before { content: "•"; position: absolute; left: 0.9cqw; }
  .stage .t a { color: inherit; text-decoration: underline; text-underline-offset: 0.15em; }
  .stage .ln { inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .stage .tb { border-collapse: collapse; table-layout: fixed; }
  .stage .tb td { padding: var(--pad); vertical-align: var(--va); line-height: 1.2; }
  .stage .ch text { font-family: "PingFang TC", "Noto Sans TC", sans-serif; }

  /* 簡報模式：一次一頁、填滿視窗 */
  body.present { overflow: hidden; background: #000; }
  body.present .bar { display: none; }
  body.present main { position: fixed; inset: 0; max-width: none; padding: 0; display: grid; place-items: center; }
  body.present .slide { display: none; width: min(100vw, calc(100vh * 13.333 / 7.5)); }
  body.present .slide.on { display: block; }
  body.present .stage { border-radius: 0; box-shadow: none; }
  .hint { position: fixed; right: 12px; bottom: 10px; color: #5C7299; font: 12px Menlo, monospace; display: none; }
  body.present .hint { display: block; }

  @media (max-width: 640px) { .bar .opt { display: none; } main { padding: 16px 8px; gap: 12px; } }
  @media print {
    .bar, .hint { display: none; } main { padding: 0; gap: 0; max-width: none; }
    .slide { break-after: page; } .stage { border-radius: 0; box-shadow: none; }
    @page { size: 13.333in 7.5in; margin: 0; }
  }
</style>
</head>
<body>
<nav class="bar">
  <a href="../index.html">← 首頁</a>
  <span class="title">{{TITLE}}</span>
  <span class="count opt"><span id="cur">1</span> / {{TOTAL}}</span>
  <a class="opt" href="{{NOTES_HREF}}">講稿</a>
  <a class="opt" href="{{QUIZ_HREF}}">複習測驗</a>
  <button id="present" type="button" title="快捷鍵 F">▶ 簡報模式</button>
</nav>
<main>
{{SLIDES}}
</main>
<div class="hint">← → 翻頁 · Esc 離開</div>
<script>
(() => {
  const slides = [...document.querySelectorAll(".slide")];
  const cur = document.getElementById("cur");
  let idx = 0;
  const fromHash = () => {
    const m = location.hash.match(/^#s(\d+)$/);
    return m ? Math.min(Math.max(+m[1] - 1, 0), slides.length - 1) : 0;
  };
  const show = (i) => {
    idx = Math.min(Math.max(i, 0), slides.length - 1);
    slides.forEach((s, k) => s.classList.toggle("on", k === idx));
    cur.textContent = idx + 1;
    history.replaceState(null, "", "#s" + (idx + 1));
  };
  const presenting = () => document.body.classList.contains("present");
  const enter = () => {
    document.body.classList.add("present");
    show(idx);
    document.documentElement.requestFullscreen?.().catch(() => {});
  };
  const leave = () => {
    document.body.classList.remove("present");
    if (document.fullscreenElement) document.exitFullscreen?.();
    slides[idx].scrollIntoView();
  };
  document.getElementById("present").addEventListener("click", enter);
  document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && presenting()) leave(); });
  document.addEventListener("keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (!presenting()) { if (e.key === "f" || e.key === "F") enter(); return; }
    if (["ArrowRight", "ArrowDown", "PageDown", " ", "Enter"].includes(e.key)) { e.preventDefault(); show(idx + 1); }
    else if (["ArrowLeft", "ArrowUp", "PageUp", "Backspace"].includes(e.key)) { e.preventDefault(); show(idx - 1); }
    else if (e.key === "Home") show(0);
    else if (e.key === "End") show(slides.length - 1);
    else if (e.key === "Escape" || e.key === "f" || e.key === "F") leave();
  });
  document.querySelector("main").addEventListener("click", (e) => {
    if (!presenting() || e.target.closest("a")) return;
    show(idx + (e.clientX < innerWidth / 3 ? -1 : 1));
  });
  // 捲動模式：頁碼跟著畫面走
  const io = new IntersectionObserver((es) => es.forEach((en) => {
    if (en.isIntersecting && !presenting()) { idx = slides.indexOf(en.target); cur.textContent = idx + 1; }
  }), { rootMargin: "-45% 0px -45% 0px" });
  slides.forEach((s) => io.observe(s));
  idx = fromHash();
  if (idx > 0) (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => slides[idx].scrollIntoView());
})();
</script>
</body>
</html>
